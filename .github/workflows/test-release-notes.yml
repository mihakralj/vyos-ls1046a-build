name: "TEST: AI release notes (OpenRouter)"

# Throwaway workflow to preview the AI-generated release notes without
# running a full ISO build or publishing a release. Dispatch manually;
# it prints the notes to the job summary. Delete after validation.
on:
  workflow_dispatch: {}

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Clone vyos-1x (7-day upstream window)
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-1x
          path: vyos-1x
          fetch-depth: 0
      - name: Clone vyos-build (7-day upstream window)
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-build
          path: vyos-build
          fetch-depth: 0

      - id: commit_ids
        run: |
          set -ex
          SINCE="7 days ago"
          cd vyos-build
          CHANGELOG_COMMIT_VYOS_BUILD=$(git log --since "$SINCE" --format="%H" --reverse | head -n1)
          [ -z "$CHANGELOG_COMMIT_VYOS_BUILD" ] && CHANGELOG_COMMIT_VYOS_BUILD="HEAD"
          echo "CHANGELOG_COMMIT_VYOS_BUILD=${CHANGELOG_COMMIT_VYOS_BUILD}" >> $GITHUB_OUTPUT
          cd ../vyos-1x
          CHANGELOG_COMMIT_VYOS_1X=$(git log --since "$SINCE" --format="%H" --reverse | head -n1)
          [ -z "$CHANGELOG_COMMIT_VYOS_1X" ] && CHANGELOG_COMMIT_VYOS_1X="HEAD"
          echo "CHANGELOG_COMMIT_VYOS_1X=${CHANGELOG_COMMIT_VYOS_1X}" >> $GITHUB_OUTPUT

      - name: Changelog vyos-1x
        id: cl_1x
        uses: mikepenz/release-changelog-builder-action@v6.1.1
        with:
          owner: "vyos"
          repo: "vyos-1x"
          fetchReviewers: false
          fromTag: ${{ steps.commit_ids.outputs.CHANGELOG_COMMIT_VYOS_1X }}
          toTag: HEAD
          configurationJson: |
            {"categories":[{"title":"","labels":[]}],"template":"#{{CHANGELOG}}","pr_template":"- #{{TITLE}}\n   - PR: vyos/vyos-1x##{{NUMBER}}"}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Changelog vyos-build
        id: cl_build
        uses: mikepenz/release-changelog-builder-action@v6.1.1
        with:
          owner: "vyos"
          repo: "vyos-build"
          fetchReviewers: false
          fromTag: ${{ steps.commit_ids.outputs.CHANGELOG_COMMIT_VYOS_BUILD }}
          toTag: HEAD
          configurationJson: |
            {"categories":[{"title":"","labels":[]}],"template":"#{{CHANGELOG}}","pr_template":"- #{{TITLE}}\n   - PR: vyos/vyos-build##{{NUMBER}}"}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Gather local repo changes
        run: |
          set -e
          SINCE="7 days ago"
          LOCAL_LOG=$(git log --since "$SINCE" --format="- %s" --no-merges \
            --invert-grep --grep="^[0-9]\{4\}\.[0-9]\{2\}\.[0-9]\{2\}-[0-9]\{4\}-rolling$" \
            HEAD 2>/dev/null || true)
          [ -z "$LOCAL_LOG" ] && LOCAL_LOG="_No local changes since last build._"
          echo "$LOCAL_LOG" > /tmp/local_changes.md
          if [ -f plans/CHANGELOG.md ]; then
            awk '/^### /{n++} n==1{print} n>1{exit}' plans/CHANGELOG.md > /tmp/changelog_top.md || true
          fi
          [ -s /tmp/changelog_top.md ] || echo "_No changelog prose available._" > /tmp/changelog_top.md

      - name: Generate release notes (AI)
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          AI_MODEL: deepseek/deepseek-v4-flash-0731
          VYOS1X_CHANGELOG: ${{ steps.cl_1x.outputs.changelog }}
          VYOSBUILD_CHANGELOG: ${{ steps.cl_build.outputs.changelog }}
        run: |
          set -e
          [ -n "$VYOS1X_CHANGELOG" ]   || VYOS1X_CHANGELOG="_No upstream vyos-1x changes in the last week._"
          [ -n "$VYOSBUILD_CHANGELOG" ] || VYOSBUILD_CHANGELOG="_No upstream vyos-build changes in the last week._"
          {
            cat <<'PROMPT'
          You are writing GitHub release notes for "VyOS for the NXP LS1046A (Mono Gateway)",
          a bare-metal ARM64 router build. Audience: network operators running this on real
          hardware. Tone: friendly and confident, but technically precise. No marketing fluff,
          no emojis. Output GitHub-Flavored Markdown ONLY: no preamble, no sign-off, and do not
          describe what you are doing — emit only the notes.

          Formatting — use rich Markdown so the notes are easy to scan:
          - Wrap every command, CLI path, config node, interface name, file path, register,
            protocol/port, numeric value with a unit, and identifier in inline backticks
            (e.g. `set interfaces ethernet eth3 offload ipv6`, `eth0`, `~7.3 Gbit/s`, `MTU 1280-3600`).
          - Show any multi-line command or config snippet as a fenced code block with a language
            hint (```bash or ```) — but never wrap the whole document in a fence.
          - Use `**bold**` for the group labels and to emphasize the single most important phrase
            in a bullet; use `_italics_` sparingly for asides like `_No changes in the last week._`.
          - Prefer tight, one-idea bullets. Use nested sub-bullets only when a bullet genuinely
            has sub-points. Link PRs with `[#NNNN](url)` Markdown links.

          Produce EXACTLY three sections, in this order:

          ## Highlights
          A short bulleted list (3-5 bullets, one line each) of the most important user-visible
          changes in this release, biggest first. Each bullet states what an operator can now DO
          that they could not before. Mention new CLI verbatim where relevant (e.g.
          `set interfaces ethernet eth<n> offload ipv4` / `offload ipv6`) and at most one headline
          performance number if it appears in the input. No lead-in paragraph — bullets only.

          ## What's New in This Build
          A categorized bullet list grouped under **Added**, **Fixed**, and **Changed** (include
          only the groups that apply), derived from the LOCAL COMMITS and LOCAL CHANGELOG PROSE.
          Rewrite terse commit subjects into operator-facing sentences that explain the EFFECT,
          not the mechanism. Collapse related commits (e.g. all IPv6 phases) into one bullet.
          Omit purely internal churn (diagnostics added then removed in the same window, build
          plumbing, patch-index cleanups) unless it changes runtime behavior. Call out anything
          that changes config syntax and note that existing configs migrate automatically. Do
          NOT expose internal patch identifiers (F-nnn, vyos-1x-0nn, commit hashes) in the
          operator-facing text. If the input mentions hardware validation or testing you may say
          "validated on hardware" but do not fabricate specifics.

          ## Upstream Changes (last 7 days)
          Summarize the UPSTREAM vyos-1x and vyos-build inputs as two short sub-lists under
          **vyos-1x** and **vyos-build**. Preserve any PR links present in the input. If a
          section's input says there are no changes, write "_No changes in the last week._"
          under that heading.

          Rules: base every statement ONLY on the provided input. Do not invent features,
          versions, or numbers. Keep it scannable: an operator should grasp the release in
          about 20 seconds and find detail if they read on.

          Here is the input:
          PROMPT
            echo
            echo "== LOCAL COMMITS (this repo, since last build) =="
            cat /tmp/local_changes.md
            echo
            echo "== LOCAL CHANGELOG PROSE (newest section of plans/CHANGELOG.md) =="
            cat /tmp/changelog_top.md
            echo
            echo "== UPSTREAM vyos-1x (last 7 days) =="
            printf '%s\n' "$VYOS1X_CHANGELOG"
            echo
            echo "== UPSTREAM vyos-build (last 7 days) =="
            printf '%s\n' "$VYOSBUILD_CHANGELOG"
          } > /tmp/notes_prompt.md

          jq -n --arg model "$AI_MODEL" --rawfile prompt /tmp/notes_prompt.md \
            '{model:$model, messages:[{role:"user",content:$prompt}], temperature:0.2, max_tokens:8000}' \
            > /tmp/ai_request.json

          set +e
          HTTP=$(curl -sS -o /tmp/ai_response.json -w '%{http_code}' \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${OPENROUTER_KEY}" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/${GITHUB_REPOSITORY}" \
            -H "X-Title: VyOS LS1046A release notes" \
            -d @/tmp/ai_request.json)
          RC=$?
          set -e

          echo "curl_rc=$RC HTTP=$HTTP"
          NOTES=""
          if [ "$RC" -eq 0 ] && [ "$HTTP" = "200" ]; then
            NOTES=$(jq -r '.choices[0].message.content // empty' /tmp/ai_response.json 2>/dev/null)
          fi
          if [ -z "$NOTES" ]; then
            echo "::warning::AI notes unavailable (curl_rc=$RC HTTP=$HTTP)"
            jq -r '.error.message // .error // empty' /tmp/ai_response.json 2>/dev/null | head -5 || true
            echo "----- raw response (first 500 bytes) -----"
            head -c 500 /tmp/ai_response.json || true
          fi
          printf '%s\n' "$NOTES" > /tmp/ai_notes.md
          sed -n '/^## /,$p' /tmp/ai_notes.md > /tmp/release_notes.md || true

          echo "===== PREVIEW ====="
          cat /tmp/release_notes.md
          {
            echo "# Release-notes preview (model: $AI_MODEL)"
            echo
            cat /tmp/release_notes.md
          } >> "$GITHUB_STEP_SUMMARY"
