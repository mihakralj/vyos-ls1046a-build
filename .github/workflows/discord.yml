name: Discord notification (reusable)

# Reusable-only workflow — no `workflow_dispatch:` trigger.
# Invoked from another workflow via `uses: ./.github/workflows/discord.yml`

on:
  workflow_call:
    inputs:
      status:
        description: 'Build result — "success" or anything else (treated as failure)'
        type: string
        required: true
      build_version:
        description: 'Release/build version string (e.g., 2026.06.19-0202-rolling)'
        type: string
        required: false
        default: 'unknown'
      build_branch:
        description: 'Branch or board target (e.g., Stock, NXP, ASK2)'
        type: string
        required: false
        default: 'Stock'
      release_type:
        description: 'Release type (e.g., LTS, Stream, Rolling)'
        type: string
        required: false
        default: 'Rolling'
      image_name:
        description: 'ISO image name produced by the build'
        type: string
        required: false
        default: 'n/a'
      channel_id:
        description: 'Discord channel ID to post to'
        type: string
        required: false
        default: '1519025519327318239'
    secrets:
      DISCORD_BOT_KEY:
        description: 'Discord bot token (Authorization: Bot <token>)'
        required: true

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: "Discord notification"
        if: always()
        env:
          DISCORD_BOT_KEY: ${{ secrets.DISCORD_BOT_KEY }}
          STATUS: ${{ inputs.status }}
          BUILD_VERSION: ${{ inputs.build_version }}
          BUILD_BRANCH: ${{ inputs.build_branch }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          IMAGE_NAME: ${{ inputs.image_name }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Truncate the full git commit SHA to the first 7 characters for a cleaner footer
          SHORT_SHA="${SHA:0:7}"

          # Generate an ISO8601 timestamp for the Discord embed footer
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Display version strips the release-channel suffix (-rolling / -stream
          # / -lts) for a cleaner header.
          DISPLAY_VERSION=$(printf '%s' "${BUILD_VERSION}" | sed -E 's/-(rolling|stream|lts)$//')

          if [ "${STATUS}" = "success" ]; then
            TITLE="📦 New VyOS LS1046A Build"
            COLOR=5763719 # Discord Green
            
            # Formats links horizontally like a navbar to save vertical space.
            # Using printf to properly handle the newlines (\n) for the JSON payload.
            DESC=$(printf '[🛠️ Install Guide](https://github.com/%s/blob/main/INSTALL.md) • [📝 Release Notes](https://github.com/%s/releases/tag/%s) • [🐙 Repository](https://github.com/%s)\n\n**Direct upgrade command:**\n\`\`\`bash\nadd system image https://github.com/%s/releases/download/%s/%s\n\`\`\`' \
              "${REPO}" "${REPO}" "${BUILD_VERSION}" "${REPO}" \
              "${REPO}" "${BUILD_VERSION}" "${IMAGE_NAME}")
          else
            TITLE="❌ VyOS LS1046A Build Failed"
            COLOR=15548997 # Discord Red
            DESC=$(printf 'The CI pipeline encountered an error during compilation.\n\n[🔍 Inspect Action Logs](https://github.com/%s/actions/runs/%s)' \
              "${REPO}" "${RUN_ID}")
          fi

          # Build the embed payload using jq. 
          # Moving Version/Flavor/Edition into 'fields' with 'inline: true' 
          # aligns them perfectly horizontally on desktop screens.
          PAYLOAD=$(jq -n \
            --arg title  "${TITLE}" \
            --argjson color "${COLOR}" \
            --arg desc "${DESC}" \
            --arg ver "\`${DISPLAY_VERSION}\`" \
            --arg fla "\`${BUILD_BRANCH}\`" \
            --arg edt "\`${RELEASE_TYPE}\`" \
            --arg footer "Commit: ${SHORT_SHA} • Run: #${RUN_NUMBER}" \
            --arg timestamp "${TIMESTAMP}" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                description: $desc,
                fields: [
                  { name: "Version", value: $ver, inline: true },
                  { name: "Flavor", value: $fla, inline: true },
                  { name: "Edition", value: $edt, inline: true }
                ],
                footer: { text: $footer },
                timestamp: $timestamp
              }]
            }')

          curl -fsS -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_KEY}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages"
