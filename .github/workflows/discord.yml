name: Discord notification (reusable)

# Reusable-only workflow — no `workflow_dispatch:` trigger.
# Invoked from another workflow via `uses: ./.github/workflows/discord.yml`

on:
  workflow_call:
    inputs:
      status:
        description: 'Build result — "success" or anything else (treated as failure)'
        type: string
        required: true
      build_version:
        description: 'Release/build version string (e.g., 2026.06.19-0202-rolling)'
        type: string
        required: false
        default: 'unknown'
      build_branch:
        description: 'Branch or board target (e.g., Stock, NXP, ASK2)'
        type: string
        required: false
        default: 'Stock'
      release_type:
        description: 'Release type (e.g., LTS, Stream, Rolling)'
        type: string
        required: false
        default: 'Rolling'
      image_name:
        description: 'ISO image name produced by the build'
        type: string
        required: false
        default: 'n/a'
      channel_id:
        description: 'Discord channel ID to post to'
        type: string
        required: false
        default: '1519025519327318239'
    secrets:
      DISCORD_BOT_KEY:
        description: 'Discord bot token (Authorization: Bot <token>)'
        required: true

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Discord
        if: always()
        env:
          DISCORD_BOT_KEY: ${{ secrets.DISCORD_BOT_KEY }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ inputs.image_name }}
          BUILD_VERSION: ${{ inputs.build_version }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail

          SHORT_SHA="${SHA:0:7}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ "${JOB_STATUS}" = "success" ]; then
            EMOJI="✅"; COLOR=5763719
          else
            EMOJI="❌"; COLOR=15548997
          fi

          PAYLOAD=$(jq -n \
            --arg emoji      "${EMOJI}" \
            --argjson color  "${COLOR}" \
            --arg version    "${BUILD_VERSION}" \
            --arg workflow   "${WORKFLOW}" \
            --arg run_number "${RUN_NUMBER}" \
            --arg run_url    "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            --arg event      "${EVENT_NAME}" \
            --arg actor      "${ACTOR}" \
            --arg branch     "${REF_NAME}" \
            --arg sha        "${SHORT_SHA}" \
            --arg commit_url "https://github.com/${REPO}/commit/${SHA}" \
            --arg image      "${IMAGE_NAME}" \
            --arg runner     "${RUNNER_NAME} (${RUNNER_OS} ${RUNNER_ARCH})" \
            --arg footer     "${REPO} • ${REF_NAME}" \
            --arg timestamp  "${TIMESTAMP}" \
            '{
              embeds: [{
                title: "\($emoji) LS1046A Build — \($version)",
                color: $color,
                fields: [
                  { name: "Workflow", value: $workflow,                          inline: true },
                  { name: "Run",      value: "[#\($run_number)](\($run_url))",    inline: true },
                  { name: "Trigger",  value: "\($event) by @\($actor)",           inline: true },
                  { name: "Branch",   value: $branch,                             inline: true },
                  { name: "Commit",   value: "[\($sha)](\($commit_url))",         inline: true },
                  { name: "Image",    value: $image,                             inline: true },
                  { name: "Runner",   value: $runner,                             inline: true }
                ],
                footer: { text: $footer },
                timestamp: $timestamp
              }]
            }')

          curl -fsS -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_KEY}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages"