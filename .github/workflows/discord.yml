name: Discord notification (reusable)

# Reusable-only workflow — no `workflow_dispatch:` trigger.
# Invoked from another workflow via `uses: ./.github/workflows/discord.yml`

on:
  workflow_call:
    inputs:
      status:
        description: 'Build result — "success" or anything else (treated as failure)'
        type: string
        required: true
      build_version:
        description: 'Release/build version string (e.g., 2026.06.19-0202-rolling)'
        type: string
        required: false
        default: 'unknown'
      build_branch:
        description: 'Branch or board target (e.g., Stock, NXP, ASK2)'
        type: string
        required: false
        default: 'Stock'
      release_type:
        description: 'Release type (e.g., LTS, Stream, Rolling)'
        type: string
        required: false
        default: 'Rolling'
      image_name:
        description: 'ISO image name produced by the build'
        type: string
        required: false
        default: 'n/a'
      channel_id:
        description: 'Discord channel ID to post to'
        type: string
        required: false
        default: '1519025519327318239'
    secrets:
      DISCORD_BOT_KEY:
        description: 'Discord bot token (Authorization: Bot <token>)'
        required: true

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: "Discord notification"
        if: always()
        env:
          DISCORD_BOT_KEY: ${{ secrets.DISCORD_BOT_KEY }}
          STATUS: ${{ inputs.status }}
          BUILD_VERSION: ${{ inputs.build_version }}
          BUILD_BRANCH: ${{ inputs.build_branch }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          IMAGE_NAME: ${{ inputs.image_name }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Truncate the full git commit SHA to the first 7 characters for a cleaner footer
          SHORT_SHA="${SHA:0:7}"

          # Build the description with real newlines via printf — jq's --arg
          # treats its value literally, so a bash string containing "\n" would be
          # JSON-encoded as the two characters backslash-n and Discord would
          # render them verbatim. printf converts \n into actual newline bytes,
          # which jq then encodes correctly as JSON "\n".
          if [ "${STATUS}" = "success" ]; then
            TITLE="✅ VyOS LS1046A Build Published"
            COLOR=5763719 # Discord Green
            DESC=$(printf '**Version:** `%s`\n**Edition:** `%s` • `%s`\n\n[📖 Install Guide](https://github.com/%s/blob/main/INSTALL.md) | [📦 Release Notes](https://github.com/%s/releases/tag/%s) | [📁 Repository](https://github.com/%s)\n\n**To upgrade directly from the CLI, run:**\n```bash\nadd system image https://github.com/%s/releases/download/%s/%s\n```' \
              "${BUILD_VERSION}" "${BUILD_BRANCH}" "${RELEASE_TYPE}" \
              "${REPO}" "${REPO}" "${BUILD_VERSION}" "${REPO}" \
              "${REPO}" "${BUILD_VERSION}" "${IMAGE_NAME}")
          else
            TITLE="❌ VyOS LS1046A Build Failed"
            COLOR=15548997 # Discord Red
            DESC=$(printf '**Version:** `%s`\n**Edition:** `%s` • `%s`\n\nThe automated pipeline encountered an error during compilation.\n\n[🔍 Inspect Action Logs](https://github.com/%s/actions/runs/%s)' \
              "${BUILD_VERSION}" "${BUILD_BRANCH}" "${RELEASE_TYPE}" \
              "${REPO}" "${RUN_ID}")
          fi

          # Build the embed payload using jq. 
          # By using a single 'description' block instead of multiple 'fields', 
          # the output scales beautifully on both mobile and desktop Discord clients.
          PAYLOAD=$(jq -n \
            --arg title  "${TITLE}" \
            --argjson color "${COLOR}" \
            --arg desc "${DESC}" \
            --arg footer "Commit: ${SHORT_SHA} • Run: #${RUN_NUMBER}" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                description: $desc,
                footer: { text: $footer }
              }]
            }')

          curl -fsS -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_KEY}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages"
