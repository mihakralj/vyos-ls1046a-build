name: "TEST: send Discord release preview"

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: 'Base64-encoded Discord JSON payload built locally'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-24.04
    steps:
      - name: Send preview to personal channel
        env:
          DISCORD_BOT_KEY: ${{ secrets.DISCORD_BOT_KEY }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          CHANNEL_ID: '1519025519327318239'
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/payload.json
          # Preserve the production embed exactly; add an out-of-band prefix so
          # the personal-channel message cannot be mistaken for a real release.
          jq '. + {content: "🧪 Local preview — no release was published."}' \
            /tmp/payload.json > /tmp/preview.json
          curl -fsS -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/preview.json \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages"
