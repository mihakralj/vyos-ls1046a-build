name: "TEST: send corrected Discord release message"

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: 'Base64-encoded validated Discord payload'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-24.04
    steps:
      - name: Post corrected release embed
        env:
          DISCORD_BOT_KEY: ${{ secrets.DISCORD_BOT_KEY }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          CHANNEL_ID: '1494357051378503862'
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/payload.json
          jq -e '.embeds[0].fields[3].name == "Highlights:" and .embeds[0].fields[3].inline == false' /tmp/payload.json >/dev/null
          curl -fsS -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages"
