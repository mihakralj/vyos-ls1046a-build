name: VyManager ARM64 Containers

on:
  workflow_dispatch:
  schedule:
    # Rebuild weekly on Sunday at 04:00 UTC to pick up upstream changes
    - cron: '0 4 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository_owner }}/vymanager-backend
  IMAGE_FRONTEND: ${{ github.repository_owner }}/vymanager-frontend
  UPSTREAM_REPO: Community-VyProjects/VyManager
  UPSTREAM_REF: beta

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout upstream VyManager source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:beta-arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest-arm64
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:beta-arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest-arm64
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64
