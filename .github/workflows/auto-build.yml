name: VyOS LS1046A build (reusable)

# This workflow is INTENTIONALLY reusable-only — it has no `workflow_dispatch:`
# trigger and therefore does NOT appear in the Actions "Run workflow" dropdown.
#
# It always runs on the self-hosted Azure ARM64 VM (label `ARM64`), which
# is Debian 12 bookworm aarch64 — the same distribution the build expects
# (matches the OCaml/opam pins, libc 2.36, and Python 3.11 of the
# upstream vyos-builder Docker image). The build runs natively on the host;
# there is NO `container:` block. Re-introducing `workflow_dispatch:` here
# would re-enable GitHub-hosted-runner builds and burn our public Actions
# minutes — please don't.
#
# To run a build manually, dispatch `self-hosted-build.yml` (named
# "VyOS LS1046A build (self-hosted)" in the Actions UI).

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Runner label to execute the build on'
        type: string
        required: false
        default: 'ARM64'
      BUILD_BY:
        type: string
        required: false
        default: ''
      build_version:
        type: string
        required: false
        default: ''
      skip_publish:
        description: 'Skip the publish job — set true when the main orchestrator handles release'
        type: boolean
        required: false
        default: false
    secrets:
      MOK_KEY:
        required: false
      MINISIGN_PRIVATE_KEY:
        required: false
      DISCORD_BOT_KEY:
        required: false
      VYOS_VANITY_KEY:
        required: false
      OPENROUTER_KEY:
        required: false

env:
  DEBIAN_MIRROR: http://deb.debian.org/debian/
  DEBIAN_SECURITY_MIRROR: http://deb.debian.org/debian-security
  # VyOS retired the `current/` apt path (its dist moved current->rolling). The
  # apt entry is `deb {VYOS_MIRROR} {vyos_branch} main` and vyos_branch is now
  # `rolling`, so the base MUST be `repositories/rolling/` to resolve
  # rolling/dists/rolling/Release (200). The old `current/` base produced
  # current/dists/rolling/Release -> 404 ("does not have a Release file") and
  # aborted `lb build`. Matches bin/ci-install-vyos1x-deps.sh + bin/local-build.sh.
  VYOS_MIRROR: https://packages.vyos.net/repositories/rolling/
  # vyos-1x's debian/rules and python/setup.py both look up
  # /opt/opam/${OCAML_VERSION}/share/vyconf/{vyconf.proto,vyconfd.conf}
  # to (a) ship vyconf.proto inside the libvyosconfig .deb and
  # (b) compile vyconf.proto -> vyconf.desc via protoc for the
  # vyos-1x Python dataclass generator. Without this var both
  # paths default to bogus values and the build fails with
  # "cp: cannot stat '/opt/opam//share/vyconf/vyconf.proto'" and
  # "FileNotFoundError: vyos/proto/vyconf.desc". The opam switch
  # is bootstrapped at exactly 4.14.2 in the
  # "Bootstrap OCaml/opam for libvyosconfig" step.
  OCAML_VERSION: "4.14.2"

jobs:
  build_iso:
    runs-on: ${{ inputs.runs_on || 'ARM64' }}
    permissions:
      contents: write
    env:
      # Single-image build: there is one flavor-neutral ISO. FLAVOR is left
      # empty so bin/common.sh resolves it to "default" (or data/flavor.pin
      # for a developer locally exercising the dormant ASK landing zone). The
      # ask.ko / VPP dataplanes ship dormant in the one image and are switched
      # at runtime (set system offload ask / set vpp settings), not selected at
      # build time. See AGENTS.md single-image rules + plans/DUAL-DATAPLANE.md.
      FLAVOR: ''
      # Build kernel from source (fetch-kernel-nxp.sh + stage-kernel.sh
      # --flavor ask, which unconditionally overlays the 266-file SDK
      # source drop from kernel/flavors/ask/sdk-sources/ before compiling —
      # this DOES include drivers/net/ethernet/freescale/sdk_fman/, verified
      # 2026-07-02 both on GitHub (nxp-qoriq/linux @ lf-6.12.49-2.2.0) and by
      # tracing kernel/common/scripts/stage-kernel.sh directly). This is the
      # same from-source pipeline that produced a working cdx.ko/fci.ko M2
      # build in the 2026-06-21..06-28 session history (qdrant: "M2
      # complete", "bridge offload breakthrough") — restoring it here so
      # ci-build-ask-modules.sh gets a real Module.symvers that matches the
      # actual compiled driver tree, instead of the frozen ask-kernel-6.12.49
      # release's linux-headers-*.deb (which has Module.symvers but no
      # drivers/ source at all, so cdx.ko/fci.ko/auto_bridge.ko could never
      # be built against it). Costs ~15-20 min of kernel compile per run.
      # Set ASK_KERNEL_TAG to a release tag to fall back to the pre-built
      # kernel .deb shortcut instead (skips the compile, but M2 stays broken).
      # ASK_KERNEL_TAG: 'ask-kernel-6.12.49'
      # nxp-sdk branch skips the ASK2 (mainline ask.ko) OOT module build —
      # prevent ci-pick-packages.sh from FATALing on missing ask-modules-*.deb.
      # Does NOT affect ci-build-ask-modules.sh (cdx/fci/auto_bridge), which
      # is the ASK 1.x native module builder and has its own gate.
      ASK_OOT_SKIPPED: '1'
    # No `container:` — build runs natively on the self-hosted ARM64 runner.
    # The runner host (Debian 12 bookworm aarch64) provides all build deps
    # (installed in the "Install Dependencies" step below). Removing the
    # vyos-builder container removes the docker dependency on the runner
    # and gives the build direct access to /mnt NVMe and full host RAM.
    #
    # `shell: sudo -E bash -e {0}` mirrors the `--user root` of the removed
    # container: live-build needs root for debootstrap, chroot, mount,
    # losetup, kpartx, etc. The runner user (`vyos`) has passwordless
    # sudo configured on the host. `-E` preserves the environment so
    # `$GITHUB_ENV`, `$GITHUB_OUTPUT`, `$GITHUB_WORKSPACE`, and step `env:`
    # vars survive into the root shell — without `-E` sudo strips them
    # and scripts that write to those files fail with
    # "bin/ci-…sh: line N: : No such file or directory".
    defaults:
      run:
        shell: 'sudo -E bash -e {0}'
    outputs:
      BUILD_BY: ${{ steps.set_env_variables.outputs.BUILD_BY }}
      build_version: ${{ steps.set_env_variables.outputs.build_version }}
      TIMESTAMP: ${{ steps.set_env_variables.outputs.TIMESTAMP }}
      PREVIOUS_SUCCESS_BUILD_TIMESTAMP: ${{ steps.set_env_variables.outputs.PREVIOUS_SUCCESS_BUILD_TIMESTAMP }}
      image_iso: ${{ steps.build_iso.outputs.image_iso }}
      image_name: ${{ steps.build_iso.outputs.image_name }}
      flavor: ${{ steps.build_iso.outputs.flavor }}

    steps:
      - name: Verify Hardware (self-hosted)
        run: |
          echo "=== Runner Hardware ==="
          echo "CPU Cores: $(nproc)"
          lscpu | grep -E "^(Model name|Architecture|CPU\(s\)|Thread|Core)" || true
          echo ""
          echo "=== Block Devices ==="
          lsblk -d -o NAME,SIZE,MODEL 2>/dev/null || true
          echo ""
          echo "=== /mnt (NVMe scratch) ==="
          df -h /mnt || true
          ls -la /mnt || true
          echo ""
          echo "=== Memory ==="
          free -h

      - name: Configure build parallelism (self-hosted)
        run: |
          set -e
          CORES=$(nproc)
          echo "MAKEFLAGS=-j$CORES" >> "$GITHUB_ENV"
          echo "DEB_BUILD_OPTIONS=parallel=$CORES" >> "$GITHUB_ENV"
          echo "VYOS_BUILD_THREADS=$CORES" >> "$GITHUB_ENV"
          echo "### Build parallelism configured for $CORES cores"

      - name: Relocate workspace to NVMe (self-hosted)
        run: |
          set -e
          # The host has /mnt mounted on the 880 GiB NVMe scratch disk.
          # Redirect the build scratch area to NVMe to avoid the slower OS disk.
          mkdir -p /mnt/build-workspace
          # Clean any stale content from a previous run of the same job
          rm -rf /mnt/build-workspace/* /mnt/build-workspace/.[!.]* 2>/dev/null || true
          echo "NVMe scratch ready at /mnt/build-workspace"
          df -h /mnt

      - name: Reset workspace ownership (self-hosted)
        run: |
          # The build steps run via `sudo -E bash` and create root-owned
          # files in $GITHUB_WORKSPACE (live-build chroots, vyos-build/,
          # work/, packages/, etc.). On the NEXT run, actions/checkout@v6
          # runs as the unprivileged runner user (`vyos`) and tries to
          # `unlink` those root-owned files, which fails with EACCES and
          # aborts the job before the "Initialization: set env variables"
          # step ever gets to run.  Reset ownership unconditionally so
          # checkout can repopulate the workspace cleanly.
          #
          # This step itself runs as root (job-level `shell: sudo -E bash`),
          # so `$(id -un):$(id -gn)` here is root:root, not the runner user
          # -- that previous version of this step silently re-chowned
          # everything to root (chown-as-root never errors, so the intended
          # `|| chown -R vyos:vyos` fallback never ran), undoing the one fix
          # that did work (the job-started-reset-ownership.sh hook, which
          # genuinely elevates via sudo from the unprivileged vyos context)
          # right before checkout. Target vyos:vyos directly; the runner
          # user on this host is always vyos.
          set -e
          if [ -d "$GITHUB_WORKSPACE" ]; then
            chown -R vyos:vyos "$GITHUB_WORKSPACE" 2>/dev/null || true
          fi
          # Also drop any prior root-owned content under the runner work root
          # in case the workspace dir itself has the wrong owner.
          if [ -d "/mnt/nvme/_work" ]; then
            chown -R vyos:vyos /mnt/nvme/_work 2>/dev/null || true
          fi

      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Dependencies (host base + Mergiraf)
        # All host-side packages (apt + Mergiraf prebuilt) live in
        # bin/ci-install-deps.sh — single source of truth so the local
        # dev loop on this same Cobalt 100 VM (bin/dev-build.sh +
        # bin/local-build.sh) can reproduce a CI build environment
        # without dispatching CI. Adding any package inline here is a
        # layering bug — fix the script instead.
        run: bin/ci-install-deps.sh

      - name: "Initialization: set env variables"
        id: set_env_variables
        env:
          INPUT_BUILD_BY: ${{ inputs.BUILD_BY || github.event.inputs.BUILD_BY }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version || github.event.inputs.build_version }}
          REPO_OWNER_ID: ${{ github.repository_owner_id }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: bin/ci-set-version.sh

      - name: Checkout vyos-build repo
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-build
          path: vyos-build

      - name: Install vyos-1x build dependencies (VyOS apt repo)
        # All package installs live in bin/ci-install-vyos1x-deps.sh so the
        # Cobalt 100 dev loop (bin/local-build.sh) can reproduce it without
        # dispatching CI. Inline additions here are a layering bug — edit
        # the script. ORDER MATTERS: this step MUST run AFTER the `vyos-build`
        # checkout (the script reads vyos-build/docker/vyos-dev.key), which
        # is why it cannot fold into bin/ci-install-deps.sh (which runs at
        # job start, before vyos-build is cloned).
        run: bin/ci-install-vyos1x-deps.sh

      # j2lint install moved to bin/ci-install-deps.sh (runs as part of the
      # "Install Dependencies" step). Keeping the install in one script keeps
      # the local Cobalt 100 dev loop reproducible without dispatching CI.

      - name: Bootstrap OCaml/opam for libvyosconfig (cached on runner)
        # All bootstrap logic lives in bin/ci-setup-opam.sh so the Cobalt 100
        # dev loop (bin/local-build.sh) can reproduce it without dispatching
        # CI. Inline additions here are a layering bug — edit the script.
        # /opt/opam is outside $GITHUB_WORKSPACE so it survives across runs
        # on the persistent self-hosted runner: ~15 min cold, ~3 s warm.
        run: bin/ci-setup-opam.sh

      - name: Setup vyos-1x patches
        env:
          MOK_KEY: ${{ secrets.MOK_KEY }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: bin/ci-setup-vyos1x.sh

      - name: Download pre-built NXP kernel .debs (nxp-sdk only — ASK_KERNEL_TAG fallback mode)
        if: ${{ startsWith(github.ref_name, 'nxp-sdk') && env.ASK_KERNEL_TAG != '' }}
        run: |
          echo "### Downloading pre-built kernel from GitHub Release ask-kernel-6.12.49"
          BASE="https://github.com/mihakralj/vyos-ls1046a-build/releases/download/ask-kernel-6.12.49"
          curl -fsSL -o vyos-build/scripts/package-build/linux-image-6.12.49-vyos_6.12.49-1_arm64.deb \
            "$BASE/linux-image-6.12.49-vyos_6.12.49-1_arm64.deb"
          curl -fsSL -o vyos-build/scripts/package-build/linux-headers-6.12.49-vyos_6.12.49-1_arm64.deb \
            "$BASE/linux-headers-6.12.49-vyos_6.12.49-1_arm64.deb"
          echo "### Downloaded kernel .debs:"
          ls -lh vyos-build/scripts/package-build/linux-*.deb
          # Also copy to packages.chroot so kernel_version pinning in
          # ci-setup-vyos-build.sh finds them (it scans PKG_CHROOT).
          mkdir -p vyos-build/data/live-build-config/packages.chroot
          cp -v vyos-build/scripts/package-build/linux-*.deb \
            vyos-build/data/live-build-config/packages.chroot/

      - name: Check ASK kernel patches/sdk-sources match the pin (nxp-sdk only)
        if: ${{ startsWith(github.ref_name, 'nxp-sdk') }}
        run: kernel/common/scripts/sync-ask-kernel.sh --check

      - name: Stage kernel tree (FLAVOR-aware)
        run: bin/ci-stage-kernel.sh

      - name: Setup kernel config and patches (mainline only — skip on nxp-sdk)
        if: ${{ !startsWith(github.ref_name, 'nxp-sdk') }}
        run: bin/ci-setup-kernel.sh

      - name: Fix swphy WARN_ON spam (nxp-sdk only — SDK 10G fixed-link polling)
        if: ${{ startsWith(github.ref_name, 'nxp-sdk') }}
        run: |
          sed -i 's/WARN_ON(speed_index < 0)/WARN_ON_ONCE(speed_index < 0)/' \
            work/linux-6.12.49/drivers/net/phy/swphy.c
          echo "### Patched swphy.c: WARN_ON -> WARN_ON_ONCE"

          # Silence phy-device-not-initialized spam (25 lines/5 ports per boot)
          sed -i '/phy device not initialized/s/netdev_err/netdev_dbg/' \
            work/linux-6.12.49/drivers/net/ethernet/freescale/sdk_dpaa/dpaa_ethtool.c
          echo "### Patched dpaa_ethtool.c: netdev_err -> netdev_dbg for phy-not-init"

          # NXP SDK kernel defaults enable_hooks=false — conntrack netfilter hooks
          # (PREROUTING/OUTPUT) are never registered → nf_conntrack_in() never fires
          # → conntrack stays deaf (zero entries) → CMM never receives nfct events
          # → ASK hardware offload never engages.
          # Force enable_hooks=true so standard Linux conntrack works.
          sed -i 's/static bool enable_hooks __read_mostly;/static bool enable_hooks __read_mostly = true;/' \
            work/linux-6.12.49/net/netfilter/nf_conntrack_standalone.c
          echo "### Patched nf_conntrack_standalone.c: enable_hooks := true"

          # Inject sk_buff fields referenced by SDK-patched consumers.
          # Fields go after _nfct (~line 926) to avoid breaking the
          # BUILD_BUG_ON assertion that requires next/prev at offset 0.
          # Remove any stale injection first (from previous CI runs — the
          # underlying_vlan_tci/ipsec_offload lines are stale as of
          # 2026-07-02 since patch 010 now declares both natively, but the
          # cleanup stays here in case a cached runner work/ dir still has
          # them from a build predating that fix).
          sed -i '/^\tint\t\tlayerscape_underlying_iif;$/d' work/linux-6.12.49/include/linux/skbuff.h
          sed -i '/^\t__u16\t\tunderlying_vlan_tci;$/d' work/linux-6.12.49/include/linux/skbuff.h
          sed -i '/^\tunsigned long\tipsec_offload;$/d' work/linux-6.12.49/include/linux/skbuff.h
          sed -i '/^\t__u16\t\tipsec_sa_handle;$/d' work/linux-6.12.49/include/linux/skbuff.h
          bin/fix-skbuff-fields.sh work/linux-6.12.49/include/linux/skbuff.h

      - name: Compile Mono DTB from DTS (mainline only — skip on nxp-sdk)
        if: ${{ !startsWith(github.ref_name, 'nxp-sdk') }}
        run: bin/ci-compile-mono-dtb.sh

      - name: Setup vyos-build (config, chroot files, hooks)
        env:
          VYOS_VANITY_KEY: ${{ secrets.VYOS_VANITY_KEY }}
        run: bin/ci-setup-vyos-build.sh

      - name: Build Image Packages
        run: bin/ci-build-packages.sh

      - name: Pick Packages
        run: bin/ci-pick-packages.sh

      - name: Install extra packages (non-Debian)
        run: bin/ci-install-extra-packages.sh

      - name: Build VyOS ISO
        id: build_iso
        env:
          BUILD_VERSION: ${{ steps.set_env_variables.outputs.build_version }}
        run: bin/ci-build-iso.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build_iso.outputs.image_name }}
          path: |
            manifest.json
            ${{ steps.build_iso.outputs.image_iso }}
            ${{ steps.build_iso.outputs.image_iso }}.minisig
          retention-days: 15
          if-no-files-found: error
          compression-level: 0

  publish:
    needs:
      - build_iso
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: (github.ref_name == 'main' || startsWith(github.ref_name, 'nxp-sdk')) && !inputs.skip_publish
    outputs:
      # Base64 keeps multiline Markdown safe across the job -> reusable-workflow
      # input boundary. discord.yml decodes and truncates to Discord's 1024-char
      # embed-field limit before building the JSON payload.
      release_highlights_b64: ${{ steps.ai_notes.outputs.release_highlights_b64 }}
    steps:
      - uses: actions/checkout@v6
      - name: Clone vyos-build repo
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-build
          path: vyos-build
          fetch-depth: 0
      - name: Clone vyos-1x source code
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-1x
          path: vyos-1x
          fetch-depth: 0

      - id: commit_ids
        name: Get commit IDs for changelog
        run: |
          set -ex
          # Weekly rolling cadence: summarise upstream changes over a fixed
          # 7-day window rather than since-last-build, so the release notes
          # cover the same span regardless of how long ago the previous
          # successful build ran. The oldest commit inside the window is the
          # `fromTag` handed to the mikepenz changelog builder below (falls
          # back to HEAD when a repo had no commits in the last week).
          SINCE="7 days ago"
          cd vyos-build
          git log --since "$SINCE" --format="%H" --reverse
          CHANGELOG_COMMIT_VYOS_BUILD=$(git log --since "$SINCE" --format="%H" --reverse | head -n1)
          [ -z "$CHANGELOG_COMMIT_VYOS_BUILD" ] && CHANGELOG_COMMIT_VYOS_BUILD="HEAD"
          echo "CHANGELOG_COMMIT_VYOS_BUILD=${CHANGELOG_COMMIT_VYOS_BUILD}" >> $GITHUB_OUTPUT
          cd ../vyos-1x
          git log --since "$SINCE" --format="%H" --reverse
          CHANGELOG_COMMIT_VYOS_1X=$(git log --since "$SINCE" --format="%H" --reverse | head -n1)
          [ -z "$CHANGELOG_COMMIT_VYOS_1X" ] && CHANGELOG_COMMIT_VYOS_1X="HEAD"
          echo "CHANGELOG_COMMIT_VYOS_1X=${CHANGELOG_COMMIT_VYOS_1X}" >> $GITHUB_OUTPUT

      - name: "Release publishing: generate changelog for vyos-1x"
        id: generate_changelog_for_vyos-1x
        uses: mikepenz/release-changelog-builder-action@v6.1.1
        with:
          owner: "vyos"
          repo: "vyos-1x"
          fetchReviewers: false
          fromTag: ${{ steps.commit_ids.outputs.CHANGELOG_COMMIT_VYOS_1X }}
          toTag: HEAD
          configurationJson: |
            {
              "categories": [{"title": "", "labels": []}],
              "template": "#{{CHANGELOG}}",
              "pr_template": "- #{{TITLE}}\n   - PR: vyos/vyos-1x##{{NUMBER}}"
            }

      - name: "Release publishing: generate changelog for vyos-build"
        id: generate_changelog_for_vyos-build
        uses: mikepenz/release-changelog-builder-action@v6.1.1
        with:
          owner: "vyos"
          repo: "vyos-build"
          fetchReviewers: false
          fromTag: ${{ steps.commit_ids.outputs.CHANGELOG_COMMIT_VYOS_BUILD }}
          toTag: HEAD
          configurationJson: |
            {
              "categories": [{"title": "", "labels": []}],
              "template": "#{{CHANGELOG}}",
              "pr_template": "- #{{TITLE}}\n   - PR: vyos/vyos-build##{{NUMBER}}"
            }

      - name: "Release publishing: gather local repo changes"
        id: local_changes
        run: |
          set -e
          # Match the upstream changelog cadence: give the notes generator every
          # local commit from a fixed seven-day window, including merge commits.
          # Subjects keep the AI input concise while still exposing feature work
          # that reaches main through a later dpaa1 merge. Exclude only generated
          # rolling-version commits, which add no release-note content.
          SINCE="7 days ago"
          LOCAL_LOG=$(git log --since "$SINCE" --date=short \
            --format="- %ad — %s" \
            --invert-grep --grep="^[0-9]\{4\}\.[0-9]\{2\}\.[0-9]\{2\}-[0-9]\{4\}-rolling$" \
            HEAD 2>/dev/null || true)
          [ -z "$LOCAL_LOG" ] && LOCAL_LOG="_No local changes in the last 7 days._"
          printf '%s\n' "$LOCAL_LOG" > /tmp/local_changes.md

      - name: "Release publishing: generate release notes (AI)"
        id: ai_notes
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          AI_MODEL: google/gemini-3.7-flash
          VYOS1X_CHANGELOG: ${{ steps.generate_changelog_for_vyos-1x.outputs.changelog }}
          VYOSBUILD_CHANGELOG: ${{ steps.generate_changelog_for_vyos-build.outputs.changelog }}
        run: |
          set -e
          [ -n "$VYOS1X_CHANGELOG" ]   || VYOS1X_CHANGELOG="_No upstream vyos-1x changes in the last week._"
          [ -n "$VYOSBUILD_CHANGELOG" ] || VYOSBUILD_CHANGELOG="_No upstream vyos-build changes in the last week._"

          # Build a single self-contained prompt file (instructions + all raw
          # material). Copilot CLI reads it via -p and writes Markdown to stdout.
          FLAVOR_PROMPT=""
          if [[ "${{ github.ref_name }}" == nxp-sdk* ]]; then
            FLAVOR_PROMPT=" (NXP ASK / LSDK 5.4 flavor with native hardware acceleration)"
          fi
          {
            cat <<PROMPT
          You are writing GitHub release notes for "VyOS for the NXP LS1046A (Mono Gateway)"${FLAVOR_PROMPT},
          a bare-metal ARM64 router build. Audience: network operators running this on real
          hardware. Tone: friendly and confident, but technically precise. No marketing fluff,
          no emojis. Output GitHub-Flavored Markdown ONLY: no preamble, no sign-off, and do not
          describe what you are doing — emit only the notes.

          Formatting — use rich Markdown so the notes are easy to scan:
          - Wrap every command, CLI path, config node, interface name, file path, register,
            protocol/port, numeric value with a unit, and identifier in inline backticks
            (e.g. `set interfaces ethernet eth3 offload ipv6`, `eth0`, `~7.3 Gbit/s`, `MTU 1280-3600`).
          - Show any multi-line command or config snippet as a fenced code block with a language
            hint (```bash or ```) — but never wrap the whole document in a fence.
          - Use `**bold**` for the group labels and to emphasize the single most important phrase
            in a bullet; use `_italics_` sparingly for asides like `_No changes in the last week._`.
          - Prefer tight, one-idea bullets. Use nested sub-bullets only when a bullet genuinely
            has sub-points. Link PRs with `[#NNNN](url)` Markdown links.

          Produce EXACTLY three sections, in this order:

          ## Highlights
          A short bulleted list (3-5 bullets, one line each) of the most important user-visible
          changes in this release, biggest first. Each bullet states what an operator can now DO
          that they could not before. Mention new CLI verbatim where relevant (e.g.
          `set interfaces ethernet eth<n> offload ipv4` / `offload ipv6`) and at most one headline
          performance number if it appears in the input. No lead-in paragraph — bullets only.

          ## What's New in This Build
          A categorized bullet list grouped under **Added**, **Fixed**, and **Changed** (include
          only the groups that apply), derived from the LOCAL COMMITS and LOCAL CHANGELOG PROSE.
          Rewrite terse commit subjects into operator-facing sentences that explain the EFFECT,
          not the mechanism. Collapse related commits (e.g. all IPv6 phases) into one bullet.
          Every user-visible LOCAL COMMIT must be represented here, either directly or within a
          collapsed related bullet; the 3-5 bullet limit applies only to Highlights. Omit purely
          internal churn (diagnostics added then removed in the same window, build
          plumbing, patch-index cleanups) unless it changes runtime behavior. Call out anything
          that changes config syntax and note that existing configs migrate automatically. Do
          NOT expose internal patch identifiers (F-nnn, vyos-1x-0nn, commit hashes) in the
          operator-facing text. If the input mentions hardware validation or testing you may say
          "validated on hardware" but do not fabricate specifics.

          ## Upstream Changes (last 7 days)
          Summarize the UPSTREAM vyos-1x and vyos-build inputs as two short sub-lists under
          **vyos-1x** and **vyos-build**. Preserve any PR links present in the input. If a
          section's input says there are no changes, write "_No changes in the last week._"
          under that heading.

          Rules: base every statement ONLY on the provided input. Do not invent features,
          versions, or numbers. Keep it scannable: an operator should grasp the release in
          about 20 seconds and find detail if they read on.

          Here is the input:
          PROMPT
            echo
            echo "== LOCAL COMMITS (this repo, last 7 days) =="
            cat /tmp/local_changes.md
            echo
            echo "== UPSTREAM vyos-1x (last 7 days) =="
            printf '%s\n' "$VYOS1X_CHANGELOG"
            echo
            echo "== UPSTREAM vyos-build (last 7 days) =="
            printf '%s\n' "$VYOSBUILD_CHANGELOG"
          } > /tmp/notes_prompt.md

          # OpenRouter Chat Completions API. Build JSON with jq so the full
          # multi-line prompt is escaped safely; never place the secret in argv
          # or logs. The model returns Markdown in choices[0].message.content.
          jq -n --arg model "$AI_MODEL" --rawfile prompt /tmp/notes_prompt.md \
            '{model:$model, messages:[{role:"user",content:$prompt}], temperature:0.2, max_tokens:10000}' \
            > /tmp/ai_request.json

          set +e
          HTTP=$(curl -sS --max-time 120 -o /tmp/ai_response.json -w '%{http_code}' \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${OPENROUTER_KEY}" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/${GITHUB_REPOSITORY}" \
            -H "X-Title: VyOS LS1046A release notes" \
            -d @/tmp/ai_request.json)
          RC=$?
          set -e

          NOTES=""
          if [ "$RC" -eq 0 ] && [ "$HTTP" = "200" ]; then
            NOTES=$(jq -r '.choices[0].message.content // empty' /tmp/ai_response.json 2>/dev/null)
          fi
          printf '%s\n' "$NOTES" > /tmp/ai_notes.md

          # Keep only from the first "## " heading onward in case the model
          # includes a short preamble despite the prompt.
          if [ -n "$NOTES" ] && grep -q '^## ' /tmp/ai_notes.md; then
            sed -n '/^## /,$p' /tmp/ai_notes.md > /tmp/release_notes.md
            echo "AI release notes generated via OpenRouter (${AI_MODEL})."
          else
            echo "::warning::AI release notes unavailable (curl_rc=${RC}, HTTP=${HTTP}); using raw fallback."
            jq -r '.error.message // empty' /tmp/ai_response.json 2>/dev/null | head -5 || true
            {
              echo "## LS1046A Build Changes"
              echo
              cat /tmp/local_changes.md
              echo
              echo "## Upstream Changes (last 7 days)"
              echo
              echo "### vyos-1x"
              printf '%s\n' "$VYOS1X_CHANGELOG"
              echo "### vyos-build"
              printf '%s\n' "$VYOSBUILD_CHANGELOG"
            } > /tmp/release_notes.md
          fi

          # Reuse the top AI summary in the successful-main Discord embed.
          # Extract only the body of `## Highlights` (not the heading), encode
          # it as one line for GITHUB_OUTPUT, and leave Discord-specific length
          # enforcement to discord.yml.
          HIGHLIGHTS=$(awk '
            /^## Highlights[[:space:]]*$/ { in_highlights=1; next }
            in_highlights && /^## / { exit }
            in_highlights { print }
          ' /tmp/release_notes.md)
          if [ -z "$HIGHLIGHTS" ]; then
            HIGHLIGHTS="_See the full release notes for build highlights._"
          fi
          HIGHLIGHTS_B64=$(printf '%s' "$HIGHLIGHTS" | base64 -w0)
          echo "release_highlights_b64=${HIGHLIGHTS_B64}" >> "$GITHUB_OUTPUT"

          echo "----- release notes -----"
          cat /tmp/release_notes.md

      # ─── Update-check feed ──────────────────────────────────────────
      # Two build flavors:
      #   • main: writes version.json + aliases (version-default.json, version-vpp.json).
      #   • nxp-sdk: writes version-ask.json pointing to the nxp-ask release.
      - name: "Release publishing: write update-check feed"
        env:
          BUILD_VERSION: ${{ needs.build_iso.outputs.build_version }}
          IMAGE_ISO: ${{ needs.build_iso.outputs.image_iso }}
          TIMESTAMP: ${{ needs.build_iso.outputs.TIMESTAMP }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if [ "${{ github.ref_name }}" = "main" ]; then
            URL="https://github.com/${REPO}/releases/download/${BUILD_VERSION}/${IMAGE_ISO}"
            cat > version.json <<EOF
[
  {
    "url": "${URL}",
    "version": "${BUILD_VERSION}",
    "timestamp": "${TIMESTAMP}"
  }
]
EOF
            cp version.json version-default.json
            cp version.json version-vpp.json
            echo "### Wrote canonical version.json + aliases (version-default.json, version-vpp.json)"
            cat version.json
          elif [[ "${{ github.ref_name }}" == nxp-sdk* ]]; then
            URL="https://github.com/${REPO}/releases/download/nxp-ask/${IMAGE_ISO}"
            cat > version-ask.json <<EOF
[
  {
    "url": "${URL}",
    "version": "${BUILD_VERSION}",
    "timestamp": "${TIMESTAMP}"
  }
]
EOF
            echo "### Wrote version-ask.json for nxp-ask release"
            cat version-ask.json
          fi

      - name: "Release publishing: check if the repository was modified during runtime to prevent autocommit failure"
        id: check_if_the_repository_was_modified_during_runtime
        run: |
          set -e
          sudo chown -R $(whoami):$(whoami) ./*
          if [ "${{ github.ref_name }}" = "main" ]; then
            FEEDS="version.json version-default.json version-vpp.json"
          else
            FEEDS="version-ask.json"
          fi
          # Stash the freshly-generated feed files before pulling.
          for f in $FEEDS; do
            [ -f "$f" ] && cp "$f" "/tmp/${f}.new"
          done
          # Reset to clean tree, pull, then restore.
          for f in $FEEDS; do
            git checkout -- "$f" 2>/dev/null || true
          done
          git pull --rebase || true
          for f in $FEEDS; do
            [ -f "/tmp/${f}.new" ] && cp "/tmp/${f}.new" "$f"
          done

      - name: "Release publishing: create autocommit and tag"
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          tagging_message: ${{ github.ref_name == 'main' && needs.build_iso.outputs.build_version || '' }}
          commit_message: ${{ needs.build_iso.outputs.build_version }}
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: ${{ github.ref_name == 'main' && 'version.json version-default.json version-vpp.json' || 'version-ask.json' }}

      - name: "Release publishing: update git tag for nxp-ask"
        if: startsWith(github.ref_name, 'nxp-sdk')
        run: |
          git tag -f nxp-ask
          git push origin -f nxp-ask || true

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build_iso.outputs.image_name }}

      - name: "Release publishing: publish release"
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          tag_name: ${{ startsWith(github.ref_name, 'nxp-sdk') && 'nxp-ask' || needs.build_iso.outputs.build_version }}
          name: ${{ startsWith(github.ref_name, 'nxp-sdk') && format('{0}-LS1046A-nxpask', needs.build_iso.outputs.build_version) || needs.build_iso.outputs.build_version }}
          prerelease: ${{ startsWith(github.ref_name, 'nxp-sdk') }}
          fail_on_unmatched_files: true
          files: |
            ${{ needs.build_iso.outputs.image_iso }}
            ${{ needs.build_iso.outputs.image_iso }}.minisig

      - uses: dev-drprasad/delete-older-releases@v0.3.4
        if: github.ref_name == 'main'
        with:
          keep_latest: 10
          delete_tags: true
          delete_tag_pattern: "-rolling"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs:
      - build_iso
      - publish
    # Notify for every branch and every outcome. For main and nxp-sdk, success requires
    # BOTH build_iso and publish so the release asset exists before Discord
    # posts its upgrade URL. For other non-release branches publish is skipped,
    # so status follows build_iso alone. discord.yml routes only
    # published releases (main and nxp-sdk) to the public release channel;
    # every other case goes to dev/failure.
    if: ${{ always() }}
    uses: ./.github/workflows/discord.yml
    with:
      status: ${{ (((github.ref_name == 'main' || startsWith(github.ref_name, 'nxp-sdk')) && needs.build_iso.result == 'success' && needs.publish.result == 'success') || (!startsWith(github.ref_name, 'nxp-sdk') && github.ref_name != 'main' && needs.build_iso.result == 'success')) && 'success' || 'failure' }}
      build_version: ${{ needs.build_iso.outputs.build_version }}
      build_branch: ${{ github.ref_name }}
      release_type: 'Rolling'
      image_iso: ${{ needs.build_iso.outputs.image_iso }}
      release_highlights_b64: ${{ needs.publish.outputs.release_highlights_b64 }}
      release_tag: ${{ startsWith(github.ref_name, 'nxp-sdk') && 'nxp-ask' || needs.build_iso.outputs.build_version }}
    secrets:
      DISCORD_BOT_KEY: ${{ secrets.DISCORD_BOT_KEY }}
