name: VyOS LS1046A build (reusable)

# This workflow is INTENTIONALLY reusable-only — it has no `workflow_dispatch:`
# trigger and therefore does NOT appear in the Actions "Run workflow" dropdown.
#
# It always runs on the self-hosted Azure ARM64 VM (label `ARM64-runner2`), which
# is Debian 12 bookworm aarch64 — the same distribution the build expects
# (matches the OCaml/opam pins, libc 2.36, and Python 3.11 of the
# upstream vyos-builder Docker image). The build runs natively on the host;
# there is NO `container:` block. Re-introducing `workflow_dispatch:` here
# would re-enable GitHub-hosted-runner builds and burn our public Actions
# minutes — please don't.
#
# To run a build manually, dispatch `self-hosted-build.yml` (named
# "VyOS LS1046A build (self-hosted)" in the Actions UI).

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Runner label to execute the build on'
        type: string
        required: false
        default: 'ARM64-runner2'
      BUILD_BY:
        type: string
        required: false
        default: ''
      build_version:
        type: string
        required: false
        default: ''
      force_clean_caches:
        description: 'Wipe kernel/vyos-1x build caches before building (debug only — normal runs rely on content-hash keys + dpkg-deb integrity checks to detect staleness)'
        type: boolean
        required: false
        default: false
    secrets:
      MOK_KEY:
        required: false
      MINISIGN_PRIVATE_KEY:
        required: false
      DISCORD_BOT_KEY:
        required: false

env:
  # Reuse the populated ISO-build chroot across runs on this persistent
  # self-hosted runner instead of a full debootstrap+dpkg-unpack every
  # time (see data/vyos-build-010-persist-chroot.patch, bin/ci-build-iso.sh).
  # Must be visible here, not just in ci-build-iso.sh: the "Unmount stale
  # chroot bind-mounts" step below unconditionally rm -rf's build/chroot
  # before build-vyos-image ever runs, which would otherwise defeat this
  # every time regardless of the Python-side persist_chroot check.
  VYOS_PERSIST_CHROOT: "1"
  DEBIAN_MIRROR: http://deb.debian.org/debian/
  DEBIAN_SECURITY_MIRROR: http://deb.debian.org/debian-security
  # VyOS retired the `current/` apt path (its dist moved current->rolling). The
  # apt entry is `deb {VYOS_MIRROR} {vyos_branch} main` and vyos_branch is now
  # `rolling`, so the base MUST be `repositories/rolling/` to resolve
  # rolling/dists/rolling/Release (200). The old `current/` base produced
  # current/dists/rolling/Release -> 404 ("does not have a Release file") and
  # aborted `lb build`. Matches bin/ci-install-vyos1x-deps.sh + bin/local-build.sh.
  VYOS_MIRROR: https://packages.vyos.net/repositories/rolling/
  # vyos-1x's debian/rules and python/setup.py both look up
  # /opt/opam/${OCAML_VERSION}/share/vyconf/{vyconf.proto,vyconfd.conf}
  # to (a) ship vyconf.proto inside the libvyosconfig .deb and
  # (b) compile vyconf.proto -> vyconf.desc via protoc for the
  # vyos-1x Python dataclass generator. Without this var both
  # paths default to bogus values and the build fails with
  # "cp: cannot stat '/opt/opam//share/vyconf/vyconf.proto'" and
  # "FileNotFoundError: vyos/proto/vyconf.desc". The opam switch
  # is bootstrapped at exactly 4.14.2 in the
  # "Bootstrap OCaml/opam for libvyosconfig" step.
  OCAML_VERSION: "4.14.2"
  # Compiler Caching (ccache / sccache) across Linux kernel, out-of-tree modules, and VPP builds.
  CCACHE_DIR: "/home/vyos/cache/ccache"
  CCACHE_MAXSIZE: "20G"
  CCACHE_COMPRESS: "1"
  CCACHE_SLOPPINESS: "time_macros,file_macro,include_file_mtime,include_file_ctime,pch_defines"
  CMAKE_C_COMPILER_LAUNCHER: "ccache"
  CMAKE_CXX_COMPILER_LAUNCHER: "ccache"

jobs:
  build_iso:
    runs-on: ${{ inputs.runs_on || 'ARM64-runner2' }}
    permissions:
      contents: write
    # Single-image build: there is one ISO. The ask.ko / VPP dataplanes ship
    # dormant in it and are switched at runtime (set interfaces ethernet ethN
    # offload ask / set vpp settings), not selected at build time. The FLAVOR
    # env var was removed 2026-07-26. See AGENTS.md + plans/DUAL-DATAPLANE.md.
    # No `container:` — build runs natively on the self-hosted ARM64 runner.
    # The runner host (Debian 12 bookworm aarch64) provides all build deps
    # (installed in the "Install Dependencies" step below). Removing the
    # vyos-builder container removes the docker dependency on the runner
    # and gives the build direct access to the host disk and full host RAM.
    #
    # `shell: sudo -E bash -e {0}` mirrors the `--user root` of the removed
    # container: live-build needs root for debootstrap, chroot, mount,
    # losetup, kpartx, etc. The runner user (`vyos`) has passwordless
    # sudo configured on the host. `-E` preserves the environment so
    # `$GITHUB_ENV`, `$GITHUB_OUTPUT`, `$GITHUB_WORKSPACE`, and step `env:`
    # vars survive into the root shell — without `-E` sudo strips them
    # and scripts that write to those files fail with
    # "bin/ci-…sh: line N: : No such file or directory".
    defaults:
      run:
        shell: 'sudo -E bash -e {0}'
    outputs:
      BUILD_BY: ${{ steps.set_env_variables.outputs.BUILD_BY }}
      build_version: ${{ steps.set_env_variables.outputs.build_version }}
      TIMESTAMP: ${{ steps.set_env_variables.outputs.TIMESTAMP }}
      PREVIOUS_SUCCESS_BUILD_TIMESTAMP: ${{ steps.set_env_variables.outputs.PREVIOUS_SUCCESS_BUILD_TIMESTAMP }}
      image_iso: ${{ steps.build_iso.outputs.image_iso }}
      image_name: ${{ steps.build_iso.outputs.image_name }}

    steps:
      - name: Verify Hardware
        run: |
          echo "=== Runner Hardware ==="
          echo "CPU Cores: $(nproc)"
          lscpu | grep -E "^(Model name|Architecture|CPU\(s\)|Thread|Core)" || true
          echo ""
          echo "=== Block Devices ==="
          lsblk -d -o NAME,SIZE,MODEL 2>/dev/null || true
          echo ""
          echo "=== Disk usage ==="
          df -h / || true
          echo ""
          echo "=== Memory ==="
          free -h

      - name: Configure build parallelism (self-hosted)
        run: |
          set -e
          CORES=$(nproc)
          echo "MAKEFLAGS=-j$CORES" >> "$GITHUB_ENV"
          echo "DEB_BUILD_OPTIONS=parallel=$CORES" >> "$GITHUB_ENV"
          echo "VYOS_BUILD_THREADS=$CORES" >> "$GITHUB_ENV"
          echo "### Build parallelism configured for $CORES cores"

      # NOTE: this workflow has exactly one caller (self-hosted-build.yml),
      # which always targets the persistent self-hosted runner ARM64-runner2
      # (see top-of-file comment — GitHub-hosted runs are intentionally not
      # supported). The next two steps clean up state left behind by a
      # PREVIOUS run on that same persistent host; they are not meaningful
      # on an ephemeral runner but there is no such caller today.

      - name: Unmount stale chroot bind-mounts (self-hosted)
        run: |
          # live-build mount --bind's proc/sys/dev into the chroot.
          # If a previous build fails mid-way, these mounts survive
          # and block actions/checkout from cleaning the workspace.
          # Force lazy-unmount any stale mounts under the chroot.
          for d in proc sys dev/pts dev; do
            mp="${GITHUB_WORKSPACE}/vyos-build/build/chroot/${d}"
            if mountpoint -q "$mp" 2>/dev/null; then
              echo "Unmounting stale bind mount: $mp"
              sudo umount -l "$mp" 2>/dev/null || true
            fi
          done
          # Also try to clean entirely if the workspace exists — unless
          # VYOS_PERSIST_CHROOT wants to reuse a chroot left by a
          # cleanly-completed prior run (build-vyos-image itself still
          # decides, via the .build/bootstrap marker, whether what's here
          # is actually reusable; this just stops removing the candidate
          # before that check ever runs).
          if [ "${VYOS_PERSIST_CHROOT:-}" != "1" ]; then
            sudo rm -rf "${GITHUB_WORKSPACE}/vyos-build/build/chroot" 2>/dev/null || true
          fi

      - name: Reset workspace ownership (self-hosted)
        run: |
          # The build steps run via `sudo -E bash` and create root-owned
          # files in $GITHUB_WORKSPACE (live-build chroots, vyos-build/,
          # work/, packages/, etc.). On the NEXT run, actions/checkout@v6
          # runs as the unprivileged runner user (`vyos`) and tries to
          # `unlink` those root-owned files, which fails with EACCES and
          # aborts the job before the "Initialization: set env variables"
          # step ever gets to run.  Reset ownership unconditionally so
          # checkout can repopulate the workspace cleanly.
          set -e
          # Also fix the runner work root — prior sudo builds leave
          # root-owned files that actions/checkout can't unlink.
          RUNNER_WORK_ROOT="$(dirname "$GITHUB_WORKSPACE")"
          if [ -d "$RUNNER_WORK_ROOT" ]; then
            sudo chown -R vyos:vyos "$RUNNER_WORK_ROOT" 2>/dev/null || true
          fi
          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo chown -R vyos:vyos "$GITHUB_WORKSPACE" 2>/dev/null || true
            sudo rm -rf "$GITHUB_WORKSPACE/.git" 2>/dev/null || true
          fi

      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Dependencies (host base + Mergiraf)
        # All host-side packages (apt + Mergiraf prebuilt) live in
        # bin/ci-install-deps.sh — single source of truth so the local
        # dev loop on this same Cobalt 100 VM (bin/dev-build.sh +
        # bin/local-build.sh) can reproduce a CI build environment
        # without dispatching CI. Adding any package inline here is a
        # layering bug — fix the script instead.
        run: bin/ci-install-deps.sh

      - name: "Initialization: set env variables"
        id: set_env_variables
        env:
          INPUT_BUILD_BY: ${{ inputs.BUILD_BY || github.event.inputs.BUILD_BY }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version || github.event.inputs.build_version }}
          REPO_OWNER_ID: ${{ github.repository_owner_id }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: bin/ci-set-version.sh

      - name: Checkout vyos-build repo
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-build
          path: vyos-build
          # vyos-build/build/ (chroot, live-build's own package cache,
          # .build/ stage markers) is gitignored — actions/checkout's
          # default clean:true runs `git clean -ffdx` on EVERY run, which
          # wipes it before VYOS_PERSIST_CHROOT's persist_chroot check in
          # build-vyos-image ever gets a chance to see it (this was the
          # actual reason runs 29892449272/29892887213 both still fell
          # back to a full `lb clean` despite the earlier
          # "Unmount stale chroot bind-mounts" gate). clean:false only
          # skips removing untracked files; tracked files (the vyos-build
          # source tree itself) are still reset to match the fetched ref
          # as normal, so the patch-apply step remains idempotent.
          clean: false

      - name: Install vyos-1x build dependencies (VyOS apt repo)
        # All package installs live in bin/ci-install-vyos1x-deps.sh so the
        # Cobalt 100 dev loop (bin/local-build.sh) can reproduce it without
        # dispatching CI. Inline additions here are a layering bug — edit
        # the script. ORDER MATTERS: this step MUST run AFTER the `vyos-build`
        # checkout (the script reads vyos-build/docker/vyos-dev.key), which
        # is why it cannot fold into bin/ci-install-deps.sh (which runs at
        # job start, before vyos-build is cloned).
        run: bin/ci-install-vyos1x-deps.sh

      # j2lint install moved to bin/ci-install-deps.sh (runs as part of the
      # "Install Dependencies" step). Keeping the install in one script keeps
      # the local Cobalt 100 dev loop reproducible without dispatching CI.

      - name: Bootstrap OCaml/opam for libvyosconfig (cached on runner)
        # All bootstrap logic lives in bin/ci-setup-opam.sh so the Cobalt 100
        # dev loop (bin/local-build.sh) can reproduce it without dispatching
        # CI. Inline additions here are a layering bug — edit the script.
        # /opt/opam is outside $GITHUB_WORKSPACE so it survives across runs
        # on the persistent self-hosted runner: ~15 min cold, ~3 s warm.
        run: bin/ci-setup-opam.sh

      - name: Setup vyos-1x patches
        env:
          MOK_KEY: ${{ secrets.MOK_KEY }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: bin/ci-setup-vyos1x.sh

      - name: Setup kernel config and patches
        run: |
          # P3: validate fixup files before running them (2-second gate)
          python3 bin/test-fixups.sh
          bin/ci-setup-kernel.sh

      # ASK2 (rewrite-in-progress): the legacy ASK 1.x build steps
      # (Consume prebuilt ASK kernel, Setup ASK fast-path kernel) were
      # removed on the ask20 branch. Until ASK2 components land
      # (ask.ko, ask_bridge.ko, askd, ask-load, libask_fci) per
      # specs/ask2-rewrite-spec.md, the single image ships
      # without ASK userspace or an SDK kernel; ASK engages at runtime
      # (set system offload ask) once those components are built in.

      - name: Compile Mono DTB from DTS (always rebuild from source)
        run: bin/ci-compile-mono-dtb.sh

      - name: Setup vyos-build (config, chroot files, hooks)
        run: bin/ci-setup-vyos-build.sh

      - name: Force-clean build caches (opt-in, self-hosted)
        # Staleness is normally detected automatically: both caches key on a
        # content hash (source change -> natural cache MISS), and both the
        # read and write paths now guard against corruption (atomic
        # stage->rename on write; dpkg-deb --info validation on read, with
        # per-entry eviction on failure — see bin/ci-build-packages.sh).
        # This step is only for a human who explicitly wants a clean-slate
        # build (e.g. while debugging the caching logic itself); it must
        # never run unconditionally on normal builds.
        if: ${{ inputs.force_clean_caches }}
        run: |
          set -e
          CACHE_ROOT="${RUNNER_TOOL_CACHE:-/tmp}"
          echo "### force_clean_caches=true — clearing kernel cache: ${CACHE_ROOT}/linux-kernel-cache/"
          rm -rf "${CACHE_ROOT}/linux-kernel-cache/"* 2>/dev/null || true
          echo "### force_clean_caches=true — clearing vyos-1x cache: ${CACHE_ROOT}/vyos-1x-cache/"
          rm -rf "${CACHE_ROOT}/vyos-1x-cache/"* 2>/dev/null || true
          df -h / 2>/dev/null || true
          echo "### Caches cleared"

      - name: Clone Linux Kernel (git repo, not tarball)
        run: |
          KVER="${KERNEL_VERSION:-$(awk -F'"' '/^[[:space:]]*kernel_version[[:space:]]*=/{print $2; exit}' vyos-build/data/defaults.toml 2>/dev/null)}"
          [ -n "$KVER" ] || KVER="6.18.38"
          echo "### Cloning kernel v${KVER} (source of truth: vyos-build/data/defaults.toml)"
          bin/clone-kernel.sh "${KVER}"
          # The clone goes to vyos-build/scripts/package-build/linux-kernel/linux/
          # build.py skips the tarball download when this directory exists.

      - name: Build Image Packages
        run: bin/ci-build-packages.sh

      - name: Print ccache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "### ccache summary:"
            ccache -s || true
          fi

      - name: Verify round-trip patch identity
        if: success()
        run: |
          KSRC="vyos-build/scripts/package-build/linux-kernel/linux"
          if [ ! -d "$KSRC/.git" ]; then
            echo "::warning::Kernel source not a git repo — skipping round-trip check"
            exit 0
          fi
          cd "$KSRC"
          # On the git-cache path HEAD sits on top of 1.4M upstream commits
          # (the clone in ~/kernel-git-cache/linux); the apply loop appends
          # one commit per patch on top of the pinned upstream tag. Scope
          # the sweep to the loop's own commits (tag..HEAD) so upstream
          # subjects cannot false-positive.
          LOOP_BASE=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          # Count applied patches from current branch only
          # (CI apply loop creates one commit per patch: "applied: <name>")
          PATCH_COUNT=$(git log --oneline ${LOOP_BASE:+"${LOOP_BASE}.."}HEAD 2>/dev/null | grep -c 'applied:' || true)
          SERIES_COUNT=$(grep -c '\.patch$' "${GITHUB_WORKSPACE}/kernel/common/patches/board/series" 2>/dev/null || echo 0)
          echo "### Round-trip: $PATCH_COUNT applied commits vs $SERIES_COUNT series patches"
          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "::warning::No applied: commits found — kernel may not be built from git apply loop"
          elif [ "$PATCH_COUNT" -ne "$SERIES_COUNT" ]; then
            echo "::notice::Patch count diff: $PATCH_COUNT applied vs $SERIES_COUNT series (canonical branch commits included)"
          else
            echo "### Round-trip: patch count matches ($PATCH_COUNT)"
          fi
          # Verify no patch failed to apply (loop commits only)
          FAIL_COUNT=$(git log --oneline ${LOOP_BASE:+"${LOOP_BASE}.."}HEAD 2>/dev/null | grep -c 'FAILED' || true)
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::$FAIL_COUNT patch(es) failed to apply — check build log"
            exit 1
          fi

      - name: Pick Packages
        run: bin/ci-pick-packages.sh

      - name: Install extra packages (non-Debian)
        run: bin/ci-install-extra-packages.sh

      - name: Build VyOS ISO
        id: build_iso
        env:
          BUILD_VERSION: ${{ steps.set_env_variables.outputs.build_version }}
        run: bin/ci-build-iso.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build_iso.outputs.image_name }}
          path: |
            manifest.json
            ${{ steps.build_iso.outputs.image_iso }}
            ${{ steps.build_iso.outputs.image_iso }}.minisig
          retention-days: 15
          if-no-files-found: error
          compression-level: 0

  publish:
    needs:
      - build_iso
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v6
      - name: Clone vyos-build repo
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-build
          path: vyos-build
          fetch-depth: 0
      - name: Clone vyos-1x source code
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-1x
          path: vyos-1x
          fetch-depth: 0

      - id: commit_ids
        name: Get commit IDs for changelog
        run: |
          set -ex
          cd vyos-build
          git log --since "${{ needs.build_iso.outputs.PREVIOUS_SUCCESS_BUILD_TIMESTAMP }}" --format="%H" --reverse
          CHANGELOG_COMMIT_VYOS_BUILD=$(git log --since "${{ needs.build_iso.outputs.PREVIOUS_SUCCESS_BUILD_TIMESTAMP }}" --format="%H" --reverse | head -n1)
          [ -z "$CHANGELOG_COMMIT_VYOS_BUILD" ] && CHANGELOG_COMMIT_VYOS_BUILD="HEAD"
          echo "CHANGELOG_COMMIT_VYOS_BUILD=${CHANGELOG_COMMIT_VYOS_BUILD}" >> $GITHUB_OUTPUT
          cd ../vyos-1x
          git log --since "${{ needs.build_iso.outputs.PREVIOUS_SUCCESS_BUILD_TIMESTAMP }}" --format="%H" --reverse
          CHANGELOG_COMMIT_VYOS_1X=$(git log --since "${{ needs.build_iso.outputs.PREVIOUS_SUCCESS_BUILD_TIMESTAMP }}" --format="%H" --reverse | head -n1)
          [ -z "$CHANGELOG_COMMIT_VYOS_1X" ] && CHANGELOG_COMMIT_VYOS_1X="HEAD"
          echo "CHANGELOG_COMMIT_VYOS_1X=${CHANGELOG_COMMIT_VYOS_1X}" >> $GITHUB_OUTPUT

      - name: "Release publishing: generate changelog for vyos-1x"
        id: generate_changelog_for_vyos-1x
        uses: mikepenz/release-changelog-builder-action@v6.1.1
        with:
          owner: "vyos"
          repo: "vyos-1x"
          fetchReviewers: false
          fromTag: ${{ steps.commit_ids.outputs.CHANGELOG_COMMIT_VYOS_1X }}
          toTag: HEAD
          configurationJson: |
            {
              "categories": [{"title": "", "labels": []}],
              "template": "#{{CHANGELOG}}",
              "pr_template": "- #{{TITLE}}\n   - PR: vyos/vyos-1x##{{NUMBER}}"
            }

      - name: "Release publishing: generate changelog for vyos-build"
        id: generate_changelog_for_vyos-build
        uses: mikepenz/release-changelog-builder-action@v6.1.1
        with:
          owner: "vyos"
          repo: "vyos-build"
          fetchReviewers: false
          fromTag: ${{ steps.commit_ids.outputs.CHANGELOG_COMMIT_VYOS_BUILD }}
          toTag: HEAD
          configurationJson: |
            {
              "categories": [{"title": "", "labels": []}],
              "template": "#{{CHANGELOG}}",
              "pr_template": "- #{{TITLE}}\n   - PR: vyos/vyos-build##{{NUMBER}}"
            }

      - name: "Release publishing: gather local repo changes"
        id: local_changes
        run: |
          set -e
          SINCE="${{ needs.build_iso.outputs.PREVIOUS_SUCCESS_BUILD_TIMESTAMP }}"
          # Get commits in THIS repo since last build, excluding CI auto-commits (version bumps)
          LOCAL_LOG=$(git log --since "$SINCE" --format="- %s" --no-merges \
            --invert-grep --grep="^[0-9]\{4\}\.[0-9]\{2\}\.[0-9]\{2\}-[0-9]\{4\}-rolling$" \
            HEAD 2>/dev/null || true)
          if [ -z "$LOCAL_LOG" ]; then
            LOCAL_LOG="_No local changes since last build._"
          fi
          # Write to file to avoid shell quoting issues with multiline output
          echo "$LOCAL_LOG" > /tmp/local_changes.md

      - name: "Release publishing: generate release notes"
        run: |
          LOCAL_CHANGES=$(cat /tmp/local_changes.md)
          cat <<EOF > /tmp/release_notes.md
          ## LS1046A Build Changes

          ${LOCAL_CHANGES}

          ## Upstream changes since last build

          ### vyos-1x
          ${{ steps.generate_changelog_for_vyos-1x.outputs.changelog }}
          ### vyos-build
          ${{ steps.generate_changelog_for_vyos-build.outputs.changelog }}
          EOF
          cat /tmp/release_notes.md

      # ─── Single-image update-check feed ───────────────────────────────
      # One ISO → one canonical feed. version.json is the source
      # of truth; version-{default,ask,vpp}.json are written byte-identical as
      # aliases so any fielded install that baked in a per-flavor URL before the
      # 2026-06-14 flavor collapse keeps updating (deleting an alias would make a
      # persisted …/version-ask.json abort `add system image` on an empty feed).
      # See AGENTS.md update-check feed rule.
      - name: "Release publishing: write canonical version.json + aliases"
        env:
          BUILD_VERSION: ${{ needs.build_iso.outputs.build_version }}
          IMAGE_ISO: ${{ needs.build_iso.outputs.image_iso }}
          TIMESTAMP: ${{ needs.build_iso.outputs.TIMESTAMP }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          URL="https://github.com/${REPO}/releases/download/${BUILD_VERSION}/${IMAGE_ISO}"
          cat > version.json <<EOF
          [
            {
              "url": "${URL}",
              "version": "${BUILD_VERSION}",
              "timestamp": "${TIMESTAMP}"
            }
          ]
          EOF
          # Byte-identical aliases for fielded per-flavor URLs.
          cp version.json version-default.json
          cp version.json version-ask.json
          cp version.json version-vpp.json
          echo "### Wrote canonical version.json + 3 aliases"
          cat version.json

      - name: "Release publishing: check if the repository was modified during runtime to prevent autocommit failure"
        id: check_if_the_repository_was_modified_during_runtime
        run: |
          set -e
          sudo chown -R $(whoami):$(whoami) ./*
          # Stash the freshly-generated feed files before pulling.
          for f in version.json version-default.json version-ask.json version-vpp.json; do
            cp "$f" "/tmp/${f}.new"
          done
          # Reset to clean tree, pull, then restore.
          for f in version.json version-default.json version-ask.json version-vpp.json; do
            git checkout -- "$f" 2>/dev/null || true
          done
          git pull --rebase || true
          for f in version.json version-default.json version-ask.json version-vpp.json; do
            cp "/tmp/${f}.new" "$f"
          done

      - name: "Release publishing: create autocommit and tag"
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          tagging_message: ${{ needs.build_iso.outputs.build_version }}
          commit_message: ${{ needs.build_iso.outputs.build_version }}
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build_iso.outputs.image_name }}

      - name: "Release publishing: publish release"
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          tag_name: ${{ needs.build_iso.outputs.build_version }}
          fail_on_unmatched_files: true
          files: |
            ${{ needs.build_iso.outputs.image_iso }}
            ${{ needs.build_iso.outputs.image_iso }}.minisig

      - uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 10
          delete_tags: true
          delete_tag_pattern: "-rolling"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs:
      - build_iso
    # Post only for builds on main, and always (so failures are reported too).
    if: ${{ always() && github.ref_name == 'main' }}
    uses: ./.github/workflows/discord.yml
    with:
      status: ${{ needs.build_iso.result }}
      build_version: ${{ needs.build_iso.outputs.build_version }}
      build_branch: ${{ github.ref_name }}
      release_type: 'Rolling'
      image_iso: ${{ needs.build_iso.outputs.image_iso }}
    secrets:
      DISCORD_BOT_KEY: ${{ secrets.DISCORD_BOT_KEY }}
