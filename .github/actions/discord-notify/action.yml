name: "Discord notification"
description: "Post a build-result embed to Discord. Runs as a step in the calling job — no extra runner is allocated."

# Composite action (NOT a reusable workflow). It executes inline in whatever
# job calls it, so a build that is already running on the self-hosted ARM64
# runner posts the notification without spinning up a separate ubuntu-24.04 VM.
#
# Composite actions cannot read `secrets.*` directly, so the Discord bot token
# is passed in as the `bot_key` input by the caller.

inputs:
  status:
    description: 'Build result — "success" or anything else (treated as failure)'
    required: true
  build_version:
    description: 'Release/build version string'
    required: false
    default: 'unknown'
  image_name:
    description: 'ISO image name produced by the build'
    required: false
    default: 'n/a'
  channel_id:
    description: 'Discord channel ID to post to'
    required: false
    default: '1519025519327318239'
  bot_key:
    description: 'Discord bot token (pass ${{ secrets.DISCORD_BOT_KEY }})'
    required: true

runs:
  using: composite
  steps:
    - name: "Post Discord embed"
      shell: bash
      env:
        DISCORD_BOT_KEY: ${{ inputs.bot_key }}
        STATUS: ${{ inputs.status }}
        BUILD_VERSION: ${{ inputs.build_version }}
        IMAGE_NAME: ${{ inputs.image_name }}
        CHANNEL_ID: ${{ inputs.channel_id }}
        WORKFLOW: ${{ github.workflow }}
        RUN_NUMBER: ${{ github.run_number }}
        RUN_ID: ${{ github.run_id }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        ACTOR: ${{ github.actor }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        RUNNER_NAME: ${{ runner.name }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        if [ "${STATUS}" = "success" ]; then
          EMOJI="✅"
          COLOR=5763719
        else
          EMOJI="❌"
          COLOR=15548997
        fi

        # Build the embed payload with jq so all interpolated values are
        # safely JSON-escaped (titles, names, branch refs, etc.).
        PAYLOAD=$(jq -n \
          --arg title  "${EMOJI} LS1046A Build — ${BUILD_VERSION}" \
          --argjson color "${COLOR}" \
          --arg workflow "${WORKFLOW}" \
          --arg run    "[#${RUN_NUMBER}](https://github.com/${REPO}/actions/runs/${RUN_ID})" \
          --arg trigger "${EVENT_NAME} by @${ACTOR}" \
          --arg branch "${REF_NAME}" \
          --arg commit "[${SHA}](https://github.com/${REPO}/commit/${SHA})" \
          --arg image  "${IMAGE_NAME}" \
          --arg release "${BUILD_VERSION}" \
          --arg runner "${RUNNER_NAME} (${RUNNER_OS} ${RUNNER_ARCH})" \
          --arg footer "${REPO} • ${REF_NAME}" \
          '{
            embeds: [{
              title: $title,
              color: $color,
              fields: [
                { name: "Workflow", value: $workflow, inline: true },
                { name: "Run",      value: $run,      inline: true },
                { name: "Trigger",  value: $trigger,  inline: true },
                { name: "Branch",   value: $branch,   inline: true },
                { name: "Commit",   value: $commit,   inline: true },
                { name: "Image",    value: $image,    inline: true },
                { name: "Release",  value: $release,  inline: true },
                { name: "Runner",   value: $runner,   inline: true }
              ],
              footer: { text: $footer }
            }]
          }')

        curl -fsS -X POST \
          -H "Authorization: Bot ${DISCORD_BOT_KEY}" \
          -H "Content-Type: application/json" \
          -d "${PAYLOAD}" \
          "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages"
