# SPDX-License-Identifier: GPL-2.0
#
# ASK2 generic-netlink YNL schema.
# Keep this file in lock-step with include/uapi/linux/ask/ask.h and
# ask_genl.c wire encoding.

name: ask
protocol: genetlink-legacy
uapi-header: linux/ask/ask.h

definitions:
  -
    type: const
    name: family-name
    value: ask
  -
    type: const
    name: version
    value: 1

attribute-sets:
  -
    # Top-level family attributes (ASK_ATTR_*).
    name: top
    name-prefix: ask-attr-
    attributes:
      - name: info
        type: nest
      - name: muram
        type: nest
      - name: flow
        type: nest
      - name: sa
        type: nest
      - name: event
        type: nest
      - name: policer
        type: nest
      - name: port-id
        type: u8
  -
    name: info
    name-prefix: ask-info-attr-
    attributes:
      - name: driver-version
        type: string
      - name: genl-version
        type: u32
      - name: ucode-family
        type: u16
      - name: ucode-major
        type: u8
      - name: ucode-minor
        type: u8
      - name: ucode-patch
        type: u16
      - name: capabilities
        type: u64
      - name: num-fman
        type: u32
      - name: num-flows
        type: u32
      - name: max-flows
        type: u32
  -
    name: muram
    name-prefix: ask-muram-attr-
    attributes:
      - name: total-bytes
        type: u32
      - name: free-bytes
        type: u32
      - name: flow-table-bytes
        type: u32
  -
    name: flow
    name-prefix: ask-flow-attr-
    attributes:
      - name: id
        type: u64
      - name: l3-proto
        type: u16
      - name: l4-proto
        type: u8
      - name: src-ip
        type: binary
      - name: dst-ip
        type: binary
      - name: sport
        type: u16
        byte-order: big-endian
      - name: dport
        type: u16
        byte-order: big-endian
      - name: iif
        type: u32
      - name: oif
        type: u32
      - name: packets
        type: u64
      - name: bytes
        type: u64
      - name: last-seen-ns
        type: u64
      - name: hw-flow-id
        type: u32
      - name: offloaded
        type: u8
  -
    name: sa
    name-prefix: ask-sa-attr-
    attributes:
      - name: hw-sa-id
        type: u32
      - name: spi
        type: u32
        byte-order: big-endian
      - name: family
        type: u16
      - name: dst
        type: binary
      - name: reqid
        type: u32
      - name: dir
        type: u8
      - name: packets
        type: u64
      - name: bytes
        type: u64
  -
    name: event
    name-prefix: ask-event-attr-
    attributes:
      - name: type
        type: u32
      - name: timestamp-ns
        type: u64
      - name: flow-id
        type: u64
      - name: sa-id
        type: u32
      - name: reason
        type: u32
      - name: message
        type: string
  -
    name: policer
    name-prefix: ask-policer-attr-
    attributes:
      - name: port-id
        type: u8
      - name: rate-bps
        type: u32
      - name: burst-bytes
        type: u32

operations:
  list:
    -
      name: get-info
      attribute-set: info
      flags: [ admin-perm ]
      do:
        reply:
          attributes:
            - driver-version
            - genl-version
            - ucode-family
            - ucode-major
            - ucode-minor
            - ucode-patch
            - capabilities
            - num-fman
            - num-flows
            - max-flows
    -
      name: get-muram
      attribute-set: muram
      flags: [ admin-perm ]
      do:
        reply:
          attributes:
            - total-bytes
            - free-bytes
            - flow-table-bytes
    -
      name: dump-flows
      attribute-set: flow
      flags: [ admin-perm ]
      dump:
        reply:
          attributes:
            - id
            - l3-proto
            - l4-proto
            - src-ip
            - dst-ip
            - sport
            - dport
            - iif
            - oif
            - packets
            - bytes
            - last-seen-ns
            - hw-flow-id
            - offloaded
    -
      name: get-flow
      attribute-set: flow
      flags: [ admin-perm ]
      do:
        request:
          attributes:
            - id
        reply:
          attributes:
            - id
            - l3-proto
            - l4-proto
            - src-ip
            - dst-ip
            - sport
            - dport
            - iif
            - oif
            - packets
            - bytes
            - last-seen-ns
            - hw-flow-id
            - offloaded
    -
      name: dump-sas
      attribute-set: sa
      flags: [ admin-perm ]
      dump:
        reply:
          attributes:
            - hw-sa-id
            - spi
            - family
            - dst
            - reqid
            - dir
            - packets
            - bytes
    -
      name: flush-flows
      attribute-set: flow
      flags: [ admin-perm ]
      do: {}
    -
      name: flush-sas
      attribute-set: sa
      flags: [ admin-perm ]
      do: {}
    -
      name: set-policer
      attribute-set: policer
      flags: [ admin-perm ]
      do:
        request:
          attributes:
            - port-id
            - rate-bps
            - burst-bytes
    -
      name: engage
      attribute-set: top
      flags: [ admin-perm ]
      do:
        request:
          attributes:
            - port-id
    -
      name: disengage
      attribute-set: top
      flags: [ admin-perm ]
      do:
        request:
          attributes:
            - port-id

mcast-groups:
  list:
    - name: events
    - name: flows
    - name: sas
