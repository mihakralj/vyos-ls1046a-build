# SPDX-License-Identifier: GPL-2.0
#
# ASK2 generic-netlink YNL schema.
# Keep this file in lock-step with include/uapi/linux/ask/ask.h and
# ask_genl.c wire encoding.

name: ask
protocol: genetlink-legacy
uapi-header: linux/ask/ask.h

definitions:
  -
    type: const
    name: family-name
    value: ask
  -
    type: const
    name: version
    value: 1

attribute-sets:
  -
    # Top-level family attributes (ASK_ATTR_*).
    name: top
    name-prefix: ask-attr-
    attributes:
      - name: info
        type: nest
        nested-attributes: info
      - name: muram
        type: nest
        nested-attributes: muram
      - name: flow
        type: nest
        nested-attributes: flow
      - name: sa
        type: nest
        nested-attributes: sa
      - name: event
        type: nest
        nested-attributes: event
      - name: policer
        type: nest
        nested-attributes: policer
      - name: port-id
        type: u8
      - name: family-mask
        type: u8
  -
    name: info
    name-prefix: ask-info-attr-
    attributes:
      - name: driver-version
        type: string
      - name: genl-version
        type: u32
      - name: ucode-family
        type: u16
      - name: ucode-major
        type: u8
      - name: ucode-minor
        type: u8
      - name: ucode-patch
        type: u16
      - name: capabilities
        type: u64
      - name: num-fman
        type: u32
      - name: num-flows
        type: u32
      - name: max-flows
        type: u32
      - name: policy-epoch
        type: u64
      - name: revoke-state
        type: u8
      - name: unresolved-flows
        type: u32
      - name: fallback
        type: nest
        nested-attributes: fallback
        doc: |
          Per-cause monotonic counters of flows declined from hardware offload
          (software fallback).
  -
    name: fallback
    name-prefix: ask-fallback-attr-
    attributes:
      - name: admission-gate
        type: u64
        doc: |
          Declined while waiting for offload_delay_ms or S6 volume threshold.
      - name: policy-fenced
        type: u64
        doc: |
          Declined due to policy revocation fence, stale epoch, or retained owner.
      - name: unsupported-proto
        type: u64
        doc: |
          Declined because L3/L4 protocol match is unsupported in hardware.
      - name: unsupported-action
        type: u64
        doc: |
          Declined due to unsupported flow action, disabled NAT/VLAN/PPPoE gate,
          or unresolved ingress VLAN VID.
      - name: neigh-unresolved
        type: u64
        doc: |
          Declined or deferred because next-hop ARP/ND is unresolved or
          destination MAC is multicast/invalid.
      - name: port-unengaged
        type: u64
        doc: |
          Declined because ingress/egress port is not engaged, family is
          disabled, or pipeline is busy.
      - name: max-flows
        type: u64
        doc: |
          Declined because ask.max_flows admission ceiling was reached.
      - name: hw-error
        type: u64
        doc: |
          Declined due to hardware preflight/install error, pending queue full,
          or memory allocation failure.
  -
    name: muram
    name-prefix: ask-muram-attr-
    attributes:
      - name: total-bytes
        type: u32
      - name: free-bytes
        type: u32
      - name: flow-table-bytes
        type: u32
  -
    name: flow
    name-prefix: ask-flow-attr-
    attributes:
      - name: id
        type: u64
      - name: l3-proto
        type: u16
      - name: l4-proto
        type: u8
      - name: src-ip
        type: binary
      - name: dst-ip
        type: binary
      - name: sport
        type: u16
        byte-order: big-endian
      - name: dport
        type: u16
        byte-order: big-endian
      - name: iif
        type: u32
      - name: oif
        type: u32
      - name: packets
        type: u64
      - name: bytes
        type: u64
      - name: last-seen-ns
        type: u64
      - name: hw-flow-id
        type: u32
      - name: offloaded
        type: u8
      - name: port-id
        type: u8
        doc: |
          FMan hardware port the flow lives on.
      - name: agg-packets
        type: u64
        doc: |
          VLAN CC flows only: HW-forwarded packet delta on the flow's port
          since the first VLAN flow was installed there.
      - name: agg-bytes
        type: u64
        doc: |
          VLAN CC flows only: HW-forwarded byte delta on the flow's port
          since the first VLAN flow was installed there.
      - name: first-seen-ns
        type: u64
        doc: |
          Host-observed monotonic ktime_get_ns() timestamp when the flow was
          inserted into the ASK table (not a silicon hardware timestamp).
      - name: nat-flags
        type: u8
        doc: |
          ASK_NATF_* bitmask (SNAT=1, DNAT=2, SPAT=4, DPAT=8); omitted when 0.
      - name: nat-src-ip
        type: binary
        doc: |
          Translated source IP (4 B IPv4 or 16 B IPv6); present when SNAT set.
      - name: nat-dst-ip
        type: binary
        doc: |
          Translated destination IP (4 B IPv4 or 16 B IPv6); present when DNAT set.
      - name: nat-sport
        type: u16
        byte-order: big-endian
        doc: |
          Translated L4 source port; present when SPAT set.
      - name: nat-dport
        type: u16
        byte-order: big-endian
        doc: |
          Translated L4 destination port; present when DPAT set.
  -
    name: sa
    name-prefix: ask-sa-attr-
    attributes:
      - name: hw-sa-id
        type: u32
      - name: spi
        type: u32
        byte-order: big-endian
      - name: family
        type: u16
      - name: dst
        type: binary
      - name: reqid
        type: u32
      - name: dir
        type: u8
      - name: packets
        type: u64
      - name: bytes
        type: u64
  -
    name: event
    name-prefix: ask-event-attr-
    attributes:
      - name: type
        type: u32
      - name: timestamp-ns
        type: u64
      - name: flow-id
        type: u64
      - name: sa-id
        type: u32
      - name: reason
        type: u32
      - name: message
        type: string
  -
    name: policer
    name-prefix: ask-policer-attr-
    attributes:
      - name: port-id
        type: u8
      - name: rate-bps
        type: u32
      - name: burst-bytes
        type: u32

operations:
  list:
    -
      name: get-info
      attribute-set: top
      flags: [ admin-perm ]
      do:
        reply:
          attributes:
            - info
    -
      name: get-muram
      attribute-set: top
      flags: [ admin-perm ]
      do:
        reply:
          attributes:
            - muram
    -
      name: dump-flows
      attribute-set: flow
      flags: [ admin-perm ]
      dump:
        reply:
          attributes:
            - id
            - l3-proto
            - l4-proto
            - src-ip
            - dst-ip
            - sport
            - dport
            - iif
            - oif
            - packets
            - bytes
            - last-seen-ns
            - hw-flow-id
            - offloaded
            - port-id
            - agg-packets
            - agg-bytes
            - first-seen-ns
            - nat-flags
            - nat-src-ip
            - nat-dst-ip
            - nat-sport
            - nat-dport
    -
      name: get-flow
      attribute-set: flow
      flags: [ admin-perm ]
      do:
        request:
          attributes:
            - id
        reply:
          attributes:
            - id
            - l3-proto
            - l4-proto
            - src-ip
            - dst-ip
            - sport
            - dport
            - iif
            - oif
            - packets
            - bytes
            - last-seen-ns
            - hw-flow-id
            - offloaded
            - port-id
            - agg-packets
            - agg-bytes
            - first-seen-ns
            - nat-flags
            - nat-src-ip
            - nat-dst-ip
            - nat-sport
            - nat-dport
    -
      name: dump-sas
      attribute-set: sa
      flags: [ admin-perm ]
      dump:
        reply:
          attributes:
            - hw-sa-id
            - spi
            - family
            - dst
            - reqid
            - dir
            - packets
            - bytes
    -
      name: flush-flows
      attribute-set: flow
      flags: [ admin-perm ]
      do: {}
    -
      name: flush-sas
      attribute-set: sa
      flags: [ admin-perm ]
      do: {}
    -
      name: set-policer
      attribute-set: policer
      flags: [ admin-perm ]
      do:
        request:
          attributes:
            - port-id
            - rate-bps
            - burst-bytes
    -
      name: engage
      attribute-set: top
      flags: [ admin-perm ]
      do:
        request:
          attributes:
            - port-id
            - family-mask
    -
      name: disengage
      attribute-set: top
      flags: [ admin-perm ]
      do:
        request:
          attributes:
            - port-id

mcast-groups:
  list:
    - name: events
    - name: flows
    - name: sas
