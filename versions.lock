# versions.lock — pinned inputs for the consumer build pipeline.
#
# Kept in sync with upstream vyos/vyos-build rolling/data/defaults.toml by:
#   - .github/workflows/auto-build.yml (main publish job)
#   - .github/workflows/sync-versions-lock.yml (daily sync on main and dpaa1)
#
# Sourced by kernel/common/scripts/*. Each variable uses `: "${VAR:=...}"` so
# an env-var override (e.g. `KERNEL_VERSION=6.18.64 bash …`) wins over the
# default.
#
# Override hierarchy (highest precedence first):
#   1. KERNEL_VERSION env var
#   2. --fetch / SYNC_FETCH_UPSTREAM=1  ← live vyos/vyos-build rolling/data/defaults.toml
#   3. vyos-build/data/defaults.toml `kernel_version`  ← AUTO-TRACKED
#      (resolved by kernel/common/scripts/sync-kernel-version.sh)
#   4. The pin below
#
# To re-sync this file manually against live upstream vyos-build, run:
#     bash kernel/common/scripts/sync-kernel-version.sh --fetch --update

# ── Kernel ─────────────────────────────────────────────────────────────
# Persistent pin synchronized with upstream vyos/vyos-build data/defaults.toml.
: "${KERNEL_VERSION:=6.18.65}"
: "${KERNEL_SERIES:=6.18}"
# VyOS internal revision (vyos-build T9591): release = <version>-<revision>-vyos.
: "${KERNEL_REVISION:=1}"
export KERNEL_VERSION KERNEL_SERIES KERNEL_REVISION

# ── Cross-compile (skipped automatically when uname -m == aarch64) ─────
: "${ARCH:=arm64}"
export ARCH